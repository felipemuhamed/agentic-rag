[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Incremental Agentic RAG API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
knowledge = [
    "chromadb>=1.5,<2",
    "pypdf>=6.1,<7",
    "sentence-transformers[image]>=5.7,<6",
]
rag = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]
web = [
    "httpx>=0.28,<1",
]
monitoring = [
    # Pins mcp<2: the adapter is not compatible with the v2 SDK.
    "langchain-mcp-adapters>=0.3,<1",
]
tracing = [
    # v4 is the first release whose ingestion the self-hosted v4 server accepts.
    "langfuse>=4.7,<5",
]
dev = [
    "chromadb>=1.5,<2",
    "httpx>=0.28,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pypdf>=6.1,<7",
    "pytest>=8.4,<9",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
agentic-rag-ingest = "app.knowledge.ingestion.cli:main"
agentic-rag-index-image = "app.visual_catalog.cli:main"
agentic-rag-retrieve = "app.knowledge.retrieval.cli:main"
agentic-rag-ask = "app.graph.cli:main"
agentic-rag-evaluate = "app.evaluation.cli:main"
agentic-rag-evaluate-visual = "app.visual_catalog.evaluation_cli:main"
agentic-rag-monitoring-tools = "app.monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
