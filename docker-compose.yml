name: agentic-rag

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Agentic RAG}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JSON_LOGS: ${JSON_LOGS:-false}

x-knowledge-environment: &knowledge-environment
  <<: *api-environment
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
  CHROMA_MODE: http
  CHROMA_HOST: chroma
  CHROMA_PORT: 8000
  CHROMA_SSL: "false"
  CHROMA_TENANT: ${CHROMA_TENANT:-default_tenant}
  CHROMA_DATABASE: ${CHROMA_DATABASE:-default_database}
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-knowledge}
  VISUAL_CATALOG_ENABLED: ${VISUAL_CATALOG_ENABLED:-true}
  VISUAL_COLLECTION: ${VISUAL_COLLECTION:-equipment_images}
  VISUAL_EMBEDDING_MODEL: ${VISUAL_EMBEDDING_MODEL:-sentence-transformers/clip-ViT-B-32}
  VISUAL_EMBEDDING_DEVICE: ${VISUAL_EMBEDDING_DEVICE:-cpu}
  VISUAL_MAX_RESULTS: ${VISUAL_MAX_RESULTS:-3}
  VISUAL_MAX_DISTANCE: ${VISUAL_MAX_DISTANCE:-0.8}
  EQUIPMENT_IDENTIFIER_WEIGHT: ${EQUIPMENT_IDENTIFIER_WEIGHT:-0.65}
  EQUIPMENT_MIN_CONFIDENCE: ${EQUIPMENT_MIN_CONFIDENCE:-0.55}
  EQUIPMENT_AMBIGUITY_MARGIN: ${EQUIPMENT_AMBIGUITY_MARGIN:-0.08}
  INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-700}
  INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-100}
  UPLOAD_ENABLED: ${UPLOAD_ENABLED:-true}
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20000000}
  UPLOAD_WORKERS: ${UPLOAD_WORKERS:-1}
  UPLOAD_MAX_PENDING_JOBS: ${UPLOAD_MAX_PENDING_JOBS:-32}
  UPLOAD_MAX_JOBS: ${UPLOAD_MAX_JOBS:-200}
  UPLOAD_JOB_RETENTION_SECONDS: ${UPLOAD_JOB_RETENTION_SECONDS:-3600}
  KNOWLEDGE_TENANT_ID: ${KNOWLEDGE_TENANT_ID:-}
  RAG_FETCH_K: ${RAG_FETCH_K:-60}
  RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
  RAG_FINAL_K: ${RAG_FINAL_K:-5}
  RAG_LAMBDA_MULT: ${RAG_LAMBDA_MULT:-0.65}
  HF_HOME: /home/app/.cache/huggingface

x-rag-environment: &rag-environment
  <<: *knowledge-environment
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
  VISION_MODEL: ${VISION_MODEL:-}
  MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-true}
  MULTIMODAL_MAX_IMAGES: ${MULTIMODAL_MAX_IMAGES:-1}
  MULTIMODAL_MAX_IMAGE_BYTES: ${MULTIMODAL_MAX_IMAGE_BYTES:-5000000}
  MAX_RAG_ATTEMPTS: ${MAX_RAG_ATTEMPTS:-2}
  CHECKPOINTER_MODE: ${CHECKPOINTER_MODE:-sqlite}
  CHECKPOINTER_PATH: /data/checkpoints/checkpoints.sqlite
  LANGGRAPH_STRICT_MSGPACK: "true"
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  API_KEY_POLICIES: ${API_KEY_POLICIES:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-4}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_API_KEY: ${METRICS_API_KEY:-}
  STREAM_MAX_DURATION_SECONDS: ${STREAM_MAX_DURATION_SECONDS:-120}
  WARMUP_ON_STARTUP: ${WARMUP_ON_STARTUP:-true}
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
  WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
  WEB_SEARCH_DEPTH: ${WEB_SEARCH_DEPTH:-basic}
  WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-10}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
  EXTERNAL_MAX_ATTEMPTS: ${EXTERNAL_MAX_ATTEMPTS:-3}
  EXTERNAL_BACKOFF_SECONDS: ${EXTERNAL_BACKOFF_SECONDS:-0.25}
  CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
  CIRCUIT_RESET_SECONDS: ${CIRCUIT_RESET_SECONDS:-30}

x-langfuse-environment: &langfuse-environment
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
  # A single container is not a cluster; the default breaks the migrations.
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-langfuse}@langfuse-redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}

services:
  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.9}
    ports:
      - "${CHROMA_BIND:-127.0.0.1}:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data

  chroma-ready:
    image: python:${PYTHON_VERSION:-3.11}-slim
    depends_on:
      chroma:
        condition: service_started
    command:
      - python
      - -c
      - |
        import time
        import urllib.request

        for attempt in range(30):
            try:
                urllib.request.urlopen(
                    "http://chroma:8000/api/v2/healthcheck",
                    timeout=2,
                )
                raise SystemExit(0)
            except Exception:
                if attempt == 29:
                    raise
                time.sleep(2)
    restart: "no"

  api:
    image: agentic-rag-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        LLM_PROVIDER_PACKAGE: ${LLM_PROVIDER_PACKAGE:-langchain-openrouter==0.2.8}
    env_file:
      - .env
    environment: *rag-environment
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - checkpoint-data:/data/checkpoints
      - upload-data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingest:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - ./documents:/documents:ro
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  index-image:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    entrypoint: [agentic-rag-index-image]
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - ./documents:/documents:ro
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  evaluate-image:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    entrypoint: [agentic-rag-evaluate-visual]
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - ./documents:/documents:ro
      - ./evaluation:/evaluation:ro
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  retrieve:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    entrypoint: [agentic-rag-retrieve]
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  rag:
    profiles: [tools]
    image: agentic-rag-rag:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: rag
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        LLM_PROVIDER_PACKAGE: ${LLM_PROVIDER_PACKAGE:-langchain-openrouter==0.2.8}
    env_file:
      - .env
    environment: *rag-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  langfuse-web:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_VERSION:-4}
    environment:
      <<: *langfuse-environment
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      # Media is fetched by the browser, so this endpoint must be the one the
      # browser can reach, not the internal service name.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_PUBLIC_ENDPOINT:-http://localhost:9090}
      # Headless seeding creates the org, project, API keys and first user on
      # the first boot, so the keys can be set before anyone opens the UI.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-cpqd}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-CPQD}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agentic-rag}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Agentic RAG}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "${LANGFUSE_BIND:-127.0.0.1}:${LANGFUSE_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy

  langfuse-worker:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_VERSION:-4}
    environment: *langfuse-environment
    restart: unless-stopped
    init: true
    depends_on: *langfuse-depends-on

  langfuse-postgres:
    profiles: [observability]
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse}
      # Postgres and ClickHouse must both be UTC or queries return empty.
      TZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  langfuse-clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:${LANGFUSE_CLICKHOUSE_VERSION:-25.12}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
      TZ: UTC
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  langfuse-minio:
    profiles: [observability]
    image: cgr.dev/chainguard/minio:latest
    entrypoint: sh
    # The bucket has to exist before Langfuse writes its first event batch.
    command: -c 'mkdir -p /data/${LANGFUSE_S3_BUCKET:-langfuse} && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "${LANGFUSE_BIND:-127.0.0.1}:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse-minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  langfuse-redis:
    profiles: [observability]
    image: redis:7
    command: >-
      redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD:-langfuse}
      --maxmemory-policy noeviction
    environment:
      # Authenticates the healthcheck; a bare ping answers NOAUTH.
      REDISCLI_AUTH: ${LANGFUSE_REDIS_PASSWORD:-langfuse}
    volumes:
      - langfuse-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  chroma-data:
  model-cache:
  checkpoint-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  upload-data:
