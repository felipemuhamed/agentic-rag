name: agentic-rag

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Agentic RAG}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JSON_LOGS: ${JSON_LOGS:-false}

x-knowledge-environment: &knowledge-environment
  <<: *api-environment
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
  CHROMA_MODE: http
  CHROMA_HOST: chroma
  CHROMA_PORT: 8000
  CHROMA_SSL: "false"
  CHROMA_TENANT: ${CHROMA_TENANT:-default_tenant}
  CHROMA_DATABASE: ${CHROMA_DATABASE:-default_database}
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-knowledge}
  VISUAL_CATALOG_ENABLED: ${VISUAL_CATALOG_ENABLED:-true}
  VISUAL_COLLECTION: ${VISUAL_COLLECTION:-equipment_images}
  VISUAL_EMBEDDING_MODEL: ${VISUAL_EMBEDDING_MODEL:-sentence-transformers/clip-ViT-B-32}
  VISUAL_EMBEDDING_DEVICE: ${VISUAL_EMBEDDING_DEVICE:-cpu}
  VISUAL_MAX_RESULTS: ${VISUAL_MAX_RESULTS:-3}
  VISUAL_MAX_DISTANCE: ${VISUAL_MAX_DISTANCE:-0.8}
  INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-700}
  INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-100}
  UPLOAD_ENABLED: ${UPLOAD_ENABLED:-true}
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20000000}
  UPLOAD_WORKERS: ${UPLOAD_WORKERS:-1}
  UPLOAD_MAX_PENDING_JOBS: ${UPLOAD_MAX_PENDING_JOBS:-32}
  UPLOAD_MAX_JOBS: ${UPLOAD_MAX_JOBS:-200}
  UPLOAD_JOB_RETENTION_SECONDS: ${UPLOAD_JOB_RETENTION_SECONDS:-3600}
  KNOWLEDGE_TENANT_ID: ${KNOWLEDGE_TENANT_ID:-}
  RAG_FETCH_K: ${RAG_FETCH_K:-60}
  RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
  RAG_FINAL_K: ${RAG_FINAL_K:-5}
  RAG_LAMBDA_MULT: ${RAG_LAMBDA_MULT:-0.65}
  HF_HOME: /home/app/.cache/huggingface

x-rag-environment: &rag-environment
  <<: *knowledge-environment
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
  VISION_MODEL: ${VISION_MODEL:-}
  MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-true}
  MULTIMODAL_MAX_IMAGES: ${MULTIMODAL_MAX_IMAGES:-1}
  MULTIMODAL_MAX_IMAGE_BYTES: ${MULTIMODAL_MAX_IMAGE_BYTES:-5000000}
  MAX_RAG_ATTEMPTS: ${MAX_RAG_ATTEMPTS:-2}
  CHECKPOINTER_MODE: ${CHECKPOINTER_MODE:-sqlite}
  CHECKPOINTER_PATH: /data/checkpoints/checkpoints.sqlite
  LANGGRAPH_STRICT_MSGPACK: "true"
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  API_KEY_POLICIES: ${API_KEY_POLICIES:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-4}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_API_KEY: ${METRICS_API_KEY:-}
  STREAM_MAX_DURATION_SECONDS: ${STREAM_MAX_DURATION_SECONDS:-120}
  WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
  WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
  WEB_SEARCH_DEPTH: ${WEB_SEARCH_DEPTH:-basic}
  WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-10}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
  EXTERNAL_MAX_ATTEMPTS: ${EXTERNAL_MAX_ATTEMPTS:-3}
  EXTERNAL_BACKOFF_SECONDS: ${EXTERNAL_BACKOFF_SECONDS:-0.25}
  CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
  CIRCUIT_RESET_SECONDS: ${CIRCUIT_RESET_SECONDS:-30}

services:
  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.9}
    ports:
      - "${CHROMA_BIND:-127.0.0.1}:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data

  chroma-ready:
    image: python:${PYTHON_VERSION:-3.11}-slim
    depends_on:
      chroma:
        condition: service_started
    command:
      - python
      - -c
      - |
        import time
        import urllib.request

        for attempt in range(30):
            try:
                urllib.request.urlopen(
                    "http://chroma:8000/api/v2/healthcheck",
                    timeout=2,
                )
                raise SystemExit(0)
            except Exception:
                if attempt == 29:
                    raise
                time.sleep(2)
    restart: "no"

  api:
    image: agentic-rag-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        LLM_PROVIDER_PACKAGE: ${LLM_PROVIDER_PACKAGE:-langchain-openrouter==0.2.8}
    env_file:
      - .env
    environment: *rag-environment
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - checkpoint-data:/data/checkpoints
      - upload-data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingest:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - ./documents:/documents:ro
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  index-image:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    entrypoint: [agentic-rag-index-image]
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
      - ./documents:/documents:ro
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  retrieve:
    profiles: [tools]
    image: agentic-rag-knowledge:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: knowledge
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    entrypoint: [agentic-rag-retrieve]
    environment: *knowledge-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

  rag:
    profiles: [tools]
    image: agentic-rag-rag:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: rag
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        LLM_PROVIDER_PACKAGE: ${LLM_PROVIDER_PACKAGE:-langchain-openrouter==0.2.8}
    env_file:
      - .env
    environment: *rag-environment
    volumes:
      - model-cache:/home/app/.cache/huggingface
    init: true
    depends_on:
      chroma-ready:
        condition: service_completed_successfully

volumes:
  chroma-data:
  model-cache:
  checkpoint-data:
  upload-data:
